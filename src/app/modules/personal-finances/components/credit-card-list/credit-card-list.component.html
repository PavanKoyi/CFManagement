<div class="credit-card-list-container">
  <div class="header">
    <h2>Credit Cards</h2>
    <button mat-raised-button color="primary" (click)="addCreditCard()">
      <mat-icon>add</mat-icon>
      Add Credit Card
    </button>
  </div>
  
  <div class="table-container">
    <table mat-table [dataSource]="(creditCards$ | async) || []" class="credit-card-table">
      <!-- Card Name Column -->
      <ng-container matColumnDef="cardName">
        <th mat-header-cell *matHeaderCellDef>Card Name</th>
        <td mat-cell *matCellDef="let card">{{ card.cardName }}</td>
      </ng-container>
      
      <!-- Issuer Column -->
      <ng-container matColumnDef="issuer">
        <th mat-header-cell *matHeaderCellDef>Issuer</th>
        <td mat-cell *matCellDef="let card">{{ card.issuer }}</td>
      </ng-container>
      
      <!-- Card Type Column -->
      <ng-container matColumnDef="cardType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let card">{{ card.cardType }}</td>
      </ng-container>
      
      <!-- Expiry Date Column -->
      <ng-container matColumnDef="expiryDate">
        <th mat-header-cell *matHeaderCellDef>Expires</th>
        <td mat-cell *matCellDef="let card">{{ card.expiryDate | date:'MM/yy' }}</td>
      </ng-container>
      
      <!-- Current Balance Column -->
      <ng-container matColumnDef="currentBalance">
        <th mat-header-cell *matHeaderCellDef>Current Balance</th>
        <td mat-cell *matCellDef="let card">${{ card.currentBalance.toFixed(2) }}</td>
      </ng-container>
      
      <!-- Available Credit Column -->
      <ng-container matColumnDef="availableCredit">
        <th mat-header-cell *matHeaderCellDef>Available Credit</th>
        <td mat-cell *matCellDef="let card">${{ card.availableCredit.toFixed(2) }}</td>
      </ng-container>
      
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let card">
          <button mat-icon-button color="primary" (click)="editCreditCard(card.id!)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="viewExpenses(card.id!)">
            <mat-icon>receipt</mat-icon>
          </button>
        </td>
      </ng-container>
      
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
